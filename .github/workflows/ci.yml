name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-macos-dmg:
    name: Diagnose Intel DMG lifecycle
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: Verso-macOS-x64
          run-id: 34763724624
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .diagnose
      - name: Repeat real installer mount and detach
        run: |
          unzip -j .diagnose/Verso-0.1.0-x64.zip 'Verso.app/Contents/Resources/*.icns' -d .diagnose
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readdir, rm } from 'node:fs/promises';
          import path from 'node:path';
          import { createMacosDmg } from './scripts/create-macos-dmg.mjs';
          const root = path.resolve('.diagnose');
          const icon = path.join(root, (await readdir(root)).find(name => name.endsWith('.icns')));
          for (let attempt = 1; attempt <= 10; attempt++) {
            console.log(`DMG lifecycle attempt ${attempt}/10`);
            const destination = path.join(root, 'repacked.dmg');
            await createMacosDmg({ staging: root, destination, icon }, {
              run(tool, args, options = {}) {
                if (tool === '/usr/bin/hdiutil' && args[0] === 'create') {
                  args = ['convert', path.join(root, 'Verso-0.1.0-x64.dmg'), '-format', 'UDRW', '-o', args.at(-1)];
                }
                return execFileSync(tool, args, { stdio: 'inherit', ...options });
              },
            });
            await rm(destination);
          }
          NODE

  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ runner.os != 'macOS' && '1' || '' }}
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

  publish-image:
    name: Publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-macos:
    name: Package macOS
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSO_MAC_UNSIGNED: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Install build dependencies
        run: brew install poppler tesseract tesseract-lang
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Validate and package
        run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: Verso-macOS-${{ matrix.arch }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
          if-no-files-found: error
